[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Add markers here if needed
markers =
    unit: Unit tests
    integration: Integration tests

# Configure test coverage
[coverage:run]
source = app
omit = 
    tests/*
    **/__init__.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise NotImplementedError
    if __name__ == .__main__.:
    pass
    raise ImportError